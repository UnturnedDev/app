services:
    postgres:
        image: postgres:17-alpine
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-udev_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-udev_pwd}
            POSTGRES_DB: ${POSTGRES_DB:-udev_db}
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
            # Optional: any .sql or .sh files here run on first startup only
            # - ./db/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    valkey:
        image: valkey/valkey:8-alpine
        container_name: valkey
        restart: unless-stopped
        command: >
            valkey-server
            --requirepass ${VALKEY_PASSWORD:-udev_pwd}
            --appendonly yes
        environment:
            REDISCLI_AUTH: ${VALKEY_PASSWORD:-udev_pwd}
        ports:
            - '127.0.0.1:6379:6379'
        volumes:
            - valkey_data:/data
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    postgres_data:
    valkey_data:
